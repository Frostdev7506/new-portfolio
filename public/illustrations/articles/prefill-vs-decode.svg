<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
<title id="title">Prefill and decode: two phases of LLM generation</title><desc id="desc">Known prompt tokens are processed together during prefill, which produces the first reply token. Decode then continues along a sequence with one new token per step.</desc>
<defs><pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#b3ac97" opacity="0.36"/></pattern><marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 7 L2 12" fill="none" stroke="context-stroke" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1536" height="1024" fill="#f5efdf"/><rect width="1536" height="1024" fill="url(#dots)"/>
<rect x="38" y="38" width="1460" height="948" rx="22" fill="none" stroke="#bcb7a5" stroke-width="2"/>
<text x="102" y="117" fill="#6b7366" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="start">AI ENGINEERING</text>
<text x="1430" y="117" fill="#6b7366" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="end">02</text>
<text x="102" y="218" fill="#293a35" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700" text-anchor="start">One prompt. Two phases.</text>
<rect x="100" y="289" width="632" height="551" rx="24" fill="#fffaf0" stroke="#293a35" stroke-width="4"/><rect x="779" y="289" width="657" height="551" rx="24" fill="#fffaf0" stroke="#293a35" stroke-width="4"/><text x="140" y="363" fill="#287e72" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" text-anchor="start">PREFILL</text><text x="1042" y="363" fill="#d47846" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" text-anchor="start">DECODE</text><rect x="144" y="410" width="111" height="89" rx="13" fill="#d5e8df" stroke="#287e72" stroke-width="4"/><path d="M 173 446 H 226" fill="none" stroke="#287e72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 173 465 H 208" fill="none" stroke="#287e72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 199 520 V 576" fill="none" stroke="#287e72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="283" y="410" width="111" height="89" rx="13" fill="#d5e8df" stroke="#287e72" stroke-width="4"/><path d="M 312 446 H 365" fill="none" stroke="#287e72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 312 465 H 347" fill="none" stroke="#287e72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 338 520 V 576" fill="none" stroke="#287e72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="422" y="410" width="111" height="89" rx="13" fill="#d5e8df" stroke="#287e72" stroke-width="4"/><path d="M 451 446 H 504" fill="none" stroke="#287e72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 451 465 H 486" fill="none" stroke="#287e72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 477 520 V 576" fill="none" stroke="#287e72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="561" y="410" width="111" height="89" rx="13" fill="#d5e8df" stroke="#287e72" stroke-width="4"/><path d="M 590 446 H 643" fill="none" stroke="#287e72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 590 465 H 625" fill="none" stroke="#287e72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 616 520 V 576" fill="none" stroke="#287e72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="144" y="604" width="528" height="103" rx="18" fill="#d5e8df" stroke="#287e72" stroke-width="4"/><text x="408" y="670" fill="#293a35" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="middle">Process the prompt</text><text x="410" y="773" fill="#6b7366" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="500" text-anchor="middle">Known input tokens</text><path d="M 693 656 H 851 V 545" fill="none" stroke="#293a35" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="803" y="412" width="152" height="122" rx="17" fill="#d5e8df" stroke="#287e72" stroke-width="4"/><text x="879" y="462" fill="#293a35" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" text-anchor="middle">First</text><text x="879" y="503" fill="#293a35" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" text-anchor="middle">token</text><path d="M 963 474 H 1023" fill="none" stroke="#293a35" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1042" y="425" width="130" height="97" rx="17" fill="#f1d4be" stroke="#d47846" stroke-width="4"/><text x="1107" y="489" fill="#293a35" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" text-anchor="middle">2</text><path d="M 1191 474 H 1251" fill="none" stroke="#293a35" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1270" y="425" width="130" height="97" rx="17" fill="#f1d4be" stroke="#d47846" stroke-width="4"/><text x="1335" y="489" fill="#293a35" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" text-anchor="middle">3</text><text x="1108" y="716" fill="#293a35" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="middle">One token per step</text><text x="1108" y="773" fill="#6b7366" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="500" text-anchor="middle">Each step uses the cache</text><text x="768" y="943" fill="#6b7366" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="500" text-anchor="middle">Start the reply. Then continue it.</text></svg>
