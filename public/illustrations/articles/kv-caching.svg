<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
<title id="title">KV caching: reuse earlier keys and values</title><desc id="desc">A stored row of earlier key and value pairs feeds the model step alongside the newest token. The orange pair marks the new addition, and a separate arrow shows the next token being produced.</desc>
<defs><pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#b3ac97" opacity="0.36"/></pattern><marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 7 L2 12" fill="none" stroke="context-stroke" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1536" height="1024" fill="#f5efdf"/><rect width="1536" height="1024" fill="url(#dots)"/>
<rect x="38" y="38" width="1460" height="948" rx="22" fill="none" stroke="#bcb7a5" stroke-width="2"/>
<text x="102" y="117" fill="#6b7366" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="start">AI ENGINEERING</text>
<text x="1430" y="117" fill="#6b7366" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="end">01</text>
<text x="102" y="218" fill="#293a35" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700" text-anchor="start">Keep the work. Use it again.</text>
<rect x="162" y="291" width="1212" height="294" rx="26" fill="#fffaf0" stroke="#293a35" stroke-width="5"/><text x="202" y="353" fill="#293a35" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="start">KV CACHE</text><text x="1300" y="353" fill="#d47846" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="end">+ NEW</text><rect x="202" y="389" width="154" height="72" rx="12" fill="#d5e8df" stroke="#287e72" stroke-width="4"/><rect x="202" y="480" width="154" height="72" rx="12" fill="#d5e8df" stroke="#287e72" stroke-width="4"/><text x="279" y="438" fill="#287e72" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" text-anchor="middle">K</text><text x="279" y="529" fill="#287e72" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" text-anchor="middle">V</text><rect x="390" y="389" width="154" height="72" rx="12" fill="#d5e8df" stroke="#287e72" stroke-width="4"/><rect x="390" y="480" width="154" height="72" rx="12" fill="#d5e8df" stroke="#287e72" stroke-width="4"/><text x="467" y="438" fill="#287e72" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" text-anchor="middle">K</text><text x="467" y="529" fill="#287e72" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" text-anchor="middle">V</text><rect x="578" y="389" width="154" height="72" rx="12" fill="#d5e8df" stroke="#287e72" stroke-width="4"/><rect x="578" y="480" width="154" height="72" rx="12" fill="#d5e8df" stroke="#287e72" stroke-width="4"/><text x="655" y="438" fill="#287e72" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" text-anchor="middle">K</text><text x="655" y="529" fill="#287e72" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" text-anchor="middle">V</text><rect x="766" y="389" width="154" height="72" rx="12" fill="#d5e8df" stroke="#287e72" stroke-width="4"/><rect x="766" y="480" width="154" height="72" rx="12" fill="#d5e8df" stroke="#287e72" stroke-width="4"/><text x="843" y="438" fill="#287e72" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" text-anchor="middle">K</text><text x="843" y="529" fill="#287e72" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" text-anchor="middle">V</text><rect x="1139" y="389" width="154" height="72" rx="12" fill="#f1d4be" stroke="#d47846" stroke-width="4"/><rect x="1139" y="480" width="154" height="72" rx="12" fill="#f1d4be" stroke="#d47846" stroke-width="4"/><text x="1216" y="438" fill="#d47846" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" text-anchor="middle">K</text><text x="1216" y="529" fill="#d47846" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" text-anchor="middle">V</text><text x="1023" y="493" fill="#6b7366" font-family="Arial, Helvetica, sans-serif" font-size="61" font-weight="500" text-anchor="middle">+</text><path d="M 768 585 V 678" fill="none" stroke="#287e72" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="802" y="646" fill="#287e72" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" text-anchor="start">reuse</text><rect x="564" y="704" width="408" height="144" rx="22" fill="#d5e8df" stroke="#287e72" stroke-width="5"/><text x="768" y="793" fill="#293a35" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="700" text-anchor="middle">Model step</text><rect x="147" y="714" width="250" height="125" rx="19" fill="#f1d4be" stroke="#d47846" stroke-width="5"/><text x="272" y="790" fill="#293a35" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" text-anchor="middle">New token</text><path d="M 415 776 H 536" fill="none" stroke="#293a35" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1140" y="714" width="250" height="125" rx="19" fill="#fffaf0" stroke="#293a35" stroke-width="5"/><text x="1265" y="790" fill="#293a35" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" text-anchor="middle">Next token</text><path d="M 990 776 H 1110" fill="none" stroke="#293a35" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="768" y="943" fill="#6b7366" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="500" text-anchor="middle">Earlier context stays available.</text></svg>
