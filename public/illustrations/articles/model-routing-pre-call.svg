<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1700" viewBox="0 0 1080 1700" role="img" aria-labelledby="title desc">
<title id="title">Pre-call routing selects one model before generation</title>
<desc id="desc">A request to fix a README typo enters a router. The router selects one eligible model, either lightweight or capable, before that model generates the answer. The two branches are alternatives, not two calls.</desc>
<defs><pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#b3ac97" opacity=".3"/></pattern></defs>
<rect width="1080" height="1700" fill="#f5efdf"/><rect width="1080" height="1700" fill="url(#dots)"/>
<rect x="30" y="30" width="1020" height="1640" rx="22" fill="none" stroke="#bcb7a5" stroke-width="2"/>
<g font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#293a35">
<text x="68" y="112" font-size="62">Pre-call routing</text>
<g fill="none" stroke="#287e72" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
<path d="M540 420V498M520 478L540 498L560 478"/>
<path d="M540 715V830H280V948M260 928L280 948L300 928"/>
<path d="M540 830H800V948M780 928L800 948L820 928"/>
<path d="M280 1170V1240H540V1338M520 1318L540 1338L560 1318"/>
<path d="M800 1170V1240H540"/>
</g>
<path d="M211 185H869Q895 185 895 211V367Q895 393 869 393H580L540 420L500 393H211Q185 393 185 367V211Q185 185 211 185Z" fill="#fffaf0" stroke="#293a35" stroke-width="5" stroke-linejoin="round"/>
<text x="540" y="270" text-anchor="middle" font-size="60">Fix a README</text><text x="540" y="344" text-anchor="middle" font-size="60">typo</text>
<rect x="230" y="500" width="620" height="215" rx="28" fill="#d5e8df" stroke="#287e72" stroke-width="5"/>
<path d="M337 540V576M337 576L305 608M337 576L369 608" fill="none" stroke="#287e72" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<text x="430" y="604" font-size="66">Router</text><text x="540" y="674" text-anchor="middle" font-size="43">Choose one eligible model</text>
<rect x="65" y="950" width="430" height="220" rx="26" fill="#d5e8df" stroke="#287e72" stroke-width="5"/>
<rect x="585" y="950" width="430" height="220" rx="26" fill="#d5e8df" stroke="#287e72" stroke-width="5"/>
<text x="280" y="1031" text-anchor="middle" font-size="52">Lightweight</text><text x="280" y="1110" text-anchor="middle" font-size="62">LLM</text>
<text x="800" y="1031" text-anchor="middle" font-size="58">Capable</text><text x="800" y="1110" text-anchor="middle" font-size="62">LLM</text>
<text x="540" y="1076" text-anchor="middle" font-size="44" fill="#6b7366">OR</text>
<rect x="260" y="1340" width="560" height="235" rx="24" fill="#fffaf0" stroke="#287e72" stroke-width="5"/>
<text x="540" y="1428" text-anchor="middle" font-size="62">Answer</text>
<path d="M330 1481H750M330 1521H674" fill="none" stroke="#287e72" stroke-width="10" stroke-linecap="round"/>
<text x="540" y="1635" text-anchor="middle" font-size="43" fill="#6b7366" font-weight="400">Select before generating.</text>
</g></svg>