<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
<title id="title">Prompt caching: reuse a matching prefix across requests</title><desc id="desc">Two separate requests contain the same stable prompt prefix and different questions at the end. A reuse arrow connects their identical starting context, while the question tails remain distinct.</desc>
<defs><pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#b3ac97" opacity="0.36"/></pattern><marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 7 L2 12" fill="none" stroke="context-stroke" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1536" height="1024" fill="#f5efdf"/><rect width="1536" height="1024" fill="url(#dots)"/>
<rect x="38" y="38" width="1460" height="948" rx="22" fill="none" stroke="#bcb7a5" stroke-width="2"/>
<text x="102" y="117" fill="#6b7366" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="start">AI ENGINEERING</text>
<text x="1430" y="117" fill="#6b7366" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="end">03</text>
<text x="102" y="218" fill="#293a35" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700" text-anchor="start">Same prefix. New question.</text>
<text x="107" y="336" fill="#6b7366" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" text-anchor="start">REQUEST A</text><rect x="104" y="366" width="1328" height="196" rx="24" fill="#fffaf0" stroke="#293a35" stroke-width="4"/><rect x="126" y="388" width="775" height="152" rx="15" fill="#d5e8df" stroke="#287e72" stroke-width="4"/><rect x="929" y="388" width="479" height="152" rx="15" fill="#f1d4be" stroke="#d47846" stroke-width="4"/><rect x="162" y="416" width="79" height="96" rx="9" fill="#edf6ee" stroke="#287e72" stroke-width="3"/><path d="M 181 440 H 222 M 181 459 H 222 M 181 478 H 211" fill="none" stroke="#287e72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="280" y="471" fill="#293a35" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" text-anchor="start">Instructions + reference</text><text x="1167" y="479" fill="#293a35" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="700" text-anchor="middle">Question A</text><path d="M 514 578 V 672" fill="none" stroke="#287e72" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="556" y="637" fill="#287e72" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" text-anchor="start">REUSE</text><text x="107" y="677" fill="#6b7366" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" text-anchor="start">REQUEST B</text><rect x="104" y="694" width="1328" height="196" rx="24" fill="#fffaf0" stroke="#293a35" stroke-width="4"/><rect x="126" y="716" width="775" height="152" rx="15" fill="#d5e8df" stroke="#287e72" stroke-width="4"/><rect x="929" y="716" width="479" height="152" rx="15" fill="#f1d4be" stroke="#d47846" stroke-width="4"/><rect x="162" y="744" width="79" height="96" rx="9" fill="#edf6ee" stroke="#287e72" stroke-width="3"/><path d="M 181 768 H 222 M 181 787 H 222 M 181 806 H 211" fill="none" stroke="#287e72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="280" y="799" fill="#293a35" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" text-anchor="start">Instructions + reference</text><text x="1167" y="807" fill="#293a35" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="700" text-anchor="middle">Question B</text><text x="768" y="952" fill="#6b7366" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="500" text-anchor="middle">Reuse context. Generate a fresh answer.</text></svg>
