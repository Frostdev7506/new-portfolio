<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">An agent uses references to operate a browser</title>
  <desc id="desc">A terminal lists page controls and a click command beside a browser contact form. The form fields and send button have matching element references.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#17394d" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2l6 4-6 4" fill="none" stroke="#0b756c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#edf3f7"/>
  <path d="M64 139H1136" stroke="#c8d8e2" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#20394c">
    <text x="64" y="94" font-size="64" font-weight="700" letter-spacing="-2">agent-browser</text>
    <text x="1136" y="89" font-size="24" text-anchor="end" fill="#456677">Give your agent a browser.</text>

    <g filter="url(#shadow)">
      <rect x="64" y="218" width="390" height="280" rx="16" fill="#20394c"/>
      <path d="M80 218h358a16 16 0 0 1 16 16v34H64v-34a16 16 0 0 1 16-16" fill="#345264"/>
      <circle cx="87" cy="243" r="5" fill="#f3bd65"/>
      <circle cx="105" cy="243" r="5" fill="#8cc8bd"/>
      <circle cx="123" cy="243" r="5" fill="#8ba6b6"/>
      <text x="158" y="249" font-size="19" fill="#e2edf3">Agent commands</text>
    </g>

    <g font-family="Menlo, Consolas, monospace" font-size="19">
      <text x="88" y="307" fill="#f3f7fa">$ agent-browser snapshot -i</text>
      <text x="88" y="350" fill="#9fddd0">@e1 <tspan fill="#e2edf3">Email</tspan></text>
      <text x="88" y="386" fill="#9fddd0">@e2 <tspan fill="#e2edf3">Message</tspan></text>
      <text x="88" y="422" fill="#9fddd0">@e3 <tspan fill="#e2edf3">Send</tspan></text>
      <text x="88" y="470" fill="#f3f7fa">$ agent-browser click @e3</text>
    </g>

    <path d="M455 470h17q20 0 20 20v20" fill="none" stroke="#0b756c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="508" y="183" width="628" height="400" rx="18" fill="#ffffff" stroke="#a9c0ce" stroke-width="2"/>
      <path d="M526 183h592a18 18 0 0 1 18 18v39H508v-39a18 18 0 0 1 18-18" fill="#d9e7ee"/>
      <path d="M508 240h628" stroke="#a9c0ce" stroke-width="2"/>
      <circle cx="533" cy="211" r="5" fill="#7595a6"/>
      <circle cx="551" cy="211" r="5" fill="#7595a6"/>
      <circle cx="569" cy="211" r="5" fill="#7595a6"/>
      <rect x="605" y="196" width="500" height="29" rx="7" fill="#f3f7fa"/>
      <text x="624" y="216" font-size="17" fill="#456677">localhost / contact</text>

      <text x="548" y="291" font-size="32" font-weight="700" letter-spacing="-.5">Contact us</text>
      <text x="548" y="329" font-size="20" fill="#456677">Email</text>
      <rect x="548" y="343" width="408" height="48" rx="8" fill="#f6fafc" stroke="#a9c0ce" stroke-width="2"/>
      <text x="565" y="374" font-size="22">reader@example.com</text>

      <text x="548" y="426" font-size="20" fill="#456677">Message</text>
      <rect x="548" y="440" width="408" height="48" rx="8" fill="#f6fafc" stroke="#a9c0ce" stroke-width="2"/>
      <text x="565" y="471" font-size="22">Test message</text>

      <rect x="548" y="511" width="160" height="48" rx="9" fill="#0b756c"/>
      <text x="628" y="543" font-size="25" font-weight="700" text-anchor="middle" fill="#fff">Send</text>
    </g>

    <g font-family="Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#075c54" text-anchor="middle">
      <rect x="978" y="343" width="112" height="48" rx="24" fill="#d5eee6"/>
      <text x="1034" y="375">@e1</text>
      <rect x="978" y="440" width="112" height="48" rx="24" fill="#d5eee6"/>
      <text x="1034" y="472">@e2</text>
      <rect x="978" y="511" width="112" height="48" rx="24" fill="#d5eee6"/>
      <text x="1034" y="543">@e3</text>
    </g>

    <path d="M684 529l12 46 10-14 17 4-39-36z" fill="#f3bd65" stroke="#20394c" stroke-width="3" stroke-linejoin="round"/>
    <text x="64" y="566" font-size="31" font-weight="700" letter-spacing="-.4">Read. Act. Check.</text>
  </g>
</svg>
