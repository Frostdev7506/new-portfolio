<svg xmlns="http://www.w3.org/2000/svg" width="760" height="385" viewBox="0 0 760 385" role="img" aria-labelledby="title description"><title id="title">Move the validation window forward in time</title><desc id="description">The training window grows from one period to three periods. Each round tests on the immediately following period and leaves later periods unused.</desc><rect width="760" height="385" rx="12" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="43" font-size="26" fill="#233345" text-anchor="start">Move the validation window forward in time</text><text x="30" y="112" font-size="22" fill="#233345" text-anchor="start">Round 1</text><rect x="150" y="80" width="105" height="50" rx="7" fill="#dce9f9" stroke="none"/><text x="202" y="112" font-size="20" fill="#245da8" text-anchor="middle">Train</text><rect x="265" y="80" width="105" height="50" rx="7" fill="#d7eee6" stroke="none"/><text x="317" y="112" font-size="20" fill="#146b5c" text-anchor="middle">Test</text><rect x="380" y="80" width="105" height="50" rx="7" fill="#ebedf0" stroke="none"/><text x="432" y="112" font-size="20" fill="#536275" text-anchor="middle">Later</text><rect x="495" y="80" width="105" height="50" rx="7" fill="#ebedf0" stroke="none"/><text x="547" y="112" font-size="20" fill="#536275" text-anchor="middle">Later</text><rect x="610" y="80" width="105" height="50" rx="7" fill="#ebedf0" stroke="none"/><text x="662" y="112" font-size="20" fill="#536275" text-anchor="middle">Later</text><text x="30" y="184" font-size="22" fill="#233345" text-anchor="start">Round 2</text><rect x="150" y="152" width="105" height="50" rx="7" fill="#dce9f9" stroke="none"/><text x="202" y="184" font-size="20" fill="#245da8" text-anchor="middle">Train</text><rect x="265" y="152" width="105" height="50" rx="7" fill="#dce9f9" stroke="none"/><text x="317" y="184" font-size="20" fill="#245da8" text-anchor="middle">Train</text><rect x="380" y="152" width="105" height="50" rx="7" fill="#d7eee6" stroke="none"/><text x="432" y="184" font-size="20" fill="#146b5c" text-anchor="middle">Test</text><rect x="495" y="152" width="105" height="50" rx="7" fill="#ebedf0" stroke="none"/><text x="547" y="184" font-size="20" fill="#536275" text-anchor="middle">Later</text><rect x="610" y="152" width="105" height="50" rx="7" fill="#ebedf0" stroke="none"/><text x="662" y="184" font-size="20" fill="#536275" text-anchor="middle">Later</text><text x="30" y="256" font-size="22" fill="#233345" text-anchor="start">Round 3</text><rect x="150" y="224" width="105" height="50" rx="7" fill="#dce9f9" stroke="none"/><text x="202" y="256" font-size="20" fill="#245da8" text-anchor="middle">Train</text><rect x="265" y="224" width="105" height="50" rx="7" fill="#dce9f9" stroke="none"/><text x="317" y="256" font-size="20" fill="#245da8" text-anchor="middle">Train</text><rect x="380" y="224" width="105" height="50" rx="7" fill="#dce9f9" stroke="none"/><text x="432" y="256" font-size="20" fill="#245da8" text-anchor="middle">Train</text><rect x="495" y="224" width="105" height="50" rx="7" fill="#d7eee6" stroke="none"/><text x="547" y="256" font-size="20" fill="#146b5c" text-anchor="middle">Test</text><rect x="610" y="224" width="105" height="50" rx="7" fill="#ebedf0" stroke="none"/><text x="662" y="256" font-size="20" fill="#536275" text-anchor="middle">Later</text><text x="30" y="340" font-size="22" fill="#233345" text-anchor="start">Each test period comes after every training period.</text></g></svg>