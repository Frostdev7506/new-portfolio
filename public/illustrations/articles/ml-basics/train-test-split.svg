<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="title description"><title id="title">Keep the test set hidden</title><desc id="description">Of 100 examples, 80 are used for training and 20 are held back for the final test.</desc><rect width="760" height="280" rx="12" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="43" font-size="26" fill="#233345" text-anchor="start">Keep the test set hidden</text><rect x="30" y="85" width="550" height="106" rx="7" fill="#dce9f9" stroke="none"/><rect x="590" y="85" width="140" height="106" rx="7" fill="#d7eee6" stroke="none"/><text x="52" y="126" font-size="25" fill="#245da8" text-anchor="start">Training: 80 rows</text><text x="52" y="162" font-size="22" fill="#233345" text-anchor="start">Learn the pattern</text><text x="660" y="125" font-size="23" fill="#146b5c" text-anchor="middle">Test: 20</text><text x="660" y="161" font-size="22" fill="#146b5c" text-anchor="middle">Hidden</text><text x="30" y="239" font-size="22" fill="#233345" text-anchor="start">100 rows in total. Each row belongs to one set.</text></g></svg>