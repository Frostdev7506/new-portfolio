<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title description"><title id="title">Same direction, different lengths</title><desc id="description">The vectors (1, 2) and (2, 4) point in exactly the same direction, giving cosine similarity one, even though their lengths differ.</desc><rect width="760" height="520" rx="12" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="43" font-size="26" fill="#233345" text-anchor="start">Same direction, different lengths</text><line x1="95" y1="330.0" x2="625" y2="330.0" stroke="#dce3eb" stroke-width="2"/><line x1="95" y1="265.0" x2="625" y2="265.0" stroke="#dce3eb" stroke-width="2"/><line x1="95" y1="200.0" x2="625" y2="200.0" stroke="#dce3eb" stroke-width="2"/><line x1="95" y1="135" x2="625" y2="135" stroke="#dce3eb" stroke-width="2"/><line x1="95" y1="395" x2="625" y2="395" stroke="#536275" stroke-width="2"/><line x1="95" y1="395" x2="95" y2="135" stroke="#536275" stroke-width="2"/><text x="95" y="120" font-size="20" fill="#233345" text-anchor="start">Dimension 2</text><text x="360.0" y="437" font-size="20" fill="#536275" text-anchor="middle">Dimension 1</text><line x1="95" y1="395" x2="536.6666666666667" y2="163.8888888888889" stroke="#245da8" stroke-width="5"/><circle cx="536.6666666666667" cy="163.8888888888889" r="6" fill="#245da8"/><text x="546.6666666666667" y="147.8888888888889" font-size="23" fill="#245da8" text-anchor="start">Article [2, 4]</text><line x1="95" y1="395" x2="315.83333333333337" y2="279.44444444444446" stroke="#146b5c" stroke-width="5"/><circle cx="315.83333333333337" cy="279.44444444444446" r="6" fill="#146b5c"/><text x="325.83333333333337" y="314.44444444444446" font-size="23" fill="#146b5c" text-anchor="start">Tweet [1, 2]</text><text x="30" y="85" font-size="24" fill="#146b5c" text-anchor="start">Cosine similarity = 1</text><text x="30" y="480" font-size="22" fill="#233345" text-anchor="start">The longer vector is exactly twice the shorter one.</text></g></svg>