<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title description"><title id="title">Bias shifts the aim. Variance spreads the shots.</title><desc id="description">Four dartboards compare centered versus off-center predictions and tight versus scattered predictions. Low bias and low variance cluster near the target.</desc><rect width="760" height="620" rx="12" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="43" font-size="26" fill="#233345" text-anchor="start">Bias shifts the aim. Variance spreads the shots.</text><text x="190" y="100" font-size="22" fill="#233345" text-anchor="middle">Low bias, low variance</text><circle cx="190" cy="210" r="80" fill="none" stroke="#dce3eb" stroke-width="2"/><circle cx="190" cy="210" r="53" fill="none" stroke="#dce3eb" stroke-width="2"/><circle cx="190" cy="210" r="26" fill="none" stroke="#dce3eb" stroke-width="2"/><line x1="103" y1="210" x2="277" y2="210" stroke="#dce3eb" stroke-width="2"/><line x1="190" y1="123" x2="190" y2="297" stroke="#dce3eb" stroke-width="2"/><circle cx="190" cy="210" r="4" fill="#536275"/><circle cx="190" cy="210" r="6" fill="#245da8"/><circle cx="181" cy="216" r="6" fill="#245da8"/><circle cx="198" cy="219" r="6" fill="#245da8"/><circle cx="194" cy="202" r="6" fill="#245da8"/><circle cx="185" cy="200" r="6" fill="#245da8"/><text x="555" y="100" font-size="22" fill="#233345" text-anchor="middle">High bias, low variance</text><circle cx="555" cy="210" r="80" fill="none" stroke="#dce3eb" stroke-width="2"/><circle cx="555" cy="210" r="53" fill="none" stroke="#dce3eb" stroke-width="2"/><circle cx="555" cy="210" r="26" fill="none" stroke="#dce3eb" stroke-width="2"/><line x1="468" y1="210" x2="642" y2="210" stroke="#dce3eb" stroke-width="2"/><line x1="555" y1="123" x2="555" y2="297" stroke="#dce3eb" stroke-width="2"/><circle cx="555" cy="210" r="4" fill="#536275"/><circle cx="607" cy="190" r="6" fill="#245da8"/><circle cx="617" cy="195" r="6" fill="#245da8"/><circle cx="605" cy="202" r="6" fill="#245da8"/><circle cx="615" cy="180" r="6" fill="#245da8"/><circle cx="599" cy="185" r="6" fill="#245da8"/><text x="190" y="390" font-size="22" fill="#233345" text-anchor="middle">Low bias, high variance</text><circle cx="190" cy="500" r="80" fill="none" stroke="#dce3eb" stroke-width="2"/><circle cx="190" cy="500" r="53" fill="none" stroke="#dce3eb" stroke-width="2"/><circle cx="190" cy="500" r="26" fill="none" stroke="#dce3eb" stroke-width="2"/><line x1="103" y1="500" x2="277" y2="500" stroke="#dce3eb" stroke-width="2"/><line x1="190" y1="413" x2="190" y2="587" stroke="#dce3eb" stroke-width="2"/><circle cx="190" cy="500" r="4" fill="#536275"/><circle cx="130" cy="465" r="6" fill="#245da8"/><circle cx="250" cy="535" r="6" fill="#245da8"/><circle cx="140" cy="545" r="6" fill="#245da8"/><circle cx="240" cy="455" r="6" fill="#245da8"/><circle cx="190" cy="500" r="6" fill="#245da8"/><text x="555" y="390" font-size="22" fill="#233345" text-anchor="middle">High bias, high variance</text><circle cx="555" cy="500" r="80" fill="none" stroke="#dce3eb" stroke-width="2"/><circle cx="555" cy="500" r="53" fill="none" stroke="#dce3eb" stroke-width="2"/><circle cx="555" cy="500" r="26" fill="none" stroke="#dce3eb" stroke-width="2"/><line x1="468" y1="500" x2="642" y2="500" stroke="#dce3eb" stroke-width="2"/><line x1="555" y1="413" x2="555" y2="587" stroke="#dce3eb" stroke-width="2"/><circle cx="555" cy="500" r="4" fill="#536275"/><circle cx="587" cy="430" r="6" fill="#245da8"/><circle cx="645" cy="470" r="6" fill="#245da8"/><circle cx="585" cy="520" r="6" fill="#245da8"/><circle cx="630" cy="545" r="6" fill="#245da8"/><circle cx="655" cy="505" r="6" fill="#245da8"/></g></svg>