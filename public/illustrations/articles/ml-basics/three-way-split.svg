<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="title description"><title id="title">Three sets, three different jobs</title><desc id="description">Train on the training set, compare models on validation data, and use the untouched test set for final evaluation.</desc><rect width="760" height="280" rx="12" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="43" font-size="26" fill="#233345" text-anchor="start">Three sets, three different jobs</text><rect x="30" y="85" width="330" height="110" rx="7" fill="#dce9f9" stroke="none"/><text x="195.0" y="126" font-size="24" fill="#233345" text-anchor="middle">Training</text><text x="195.0" y="165" font-size="20" fill="#233345" text-anchor="middle">Learn the pattern</text><rect x="370" y="85" width="190" height="110" rx="7" fill="#e6e2f6" stroke="none"/><text x="465.0" y="126" font-size="24" fill="#233345" text-anchor="middle">Validation</text><text x="465.0" y="165" font-size="20" fill="#233345" text-anchor="middle">Tune and compare</text><rect x="570" y="85" width="160" height="110" rx="7" fill="#d7eee6" stroke="none"/><text x="650.0" y="126" font-size="24" fill="#233345" text-anchor="middle">Test</text><text x="650.0" y="165" font-size="20" fill="#233345" text-anchor="middle">Final check</text><text x="30" y="238" font-size="22" fill="#233345" text-anchor="start">The test set stays outside the model-selection loop.</text></g></svg>