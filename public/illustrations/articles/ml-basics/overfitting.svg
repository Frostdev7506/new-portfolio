<svg xmlns="http://www.w3.org/2000/svg" width="760" height="740" viewBox="0 0 760 740" role="img" aria-labelledby="title description"><title id="title">Learning the pattern versus fitting the noise</title><desc id="description">The good fit follows the overall rise in house prices. The overfit curve follows individual noisy observations and can generalize poorly.</desc><rect width="760" height="740" rx="12" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="43" font-size="26" fill="#233345" text-anchor="start">Learning the pattern versus fitting the noise</text><text x="30" y="95" font-size="24" fill="#233345" text-anchor="start">Good fit: follows the general trend</text><line x1="90" y1="257.5" x2="660" y2="257.5" stroke="#dce3eb" stroke-width="2"/><line x1="90" y1="215.0" x2="660" y2="215.0" stroke="#dce3eb" stroke-width="2"/><line x1="90" y1="172.5" x2="660" y2="172.5" stroke="#dce3eb" stroke-width="2"/><line x1="90" y1="130" x2="660" y2="130" stroke="#dce3eb" stroke-width="2"/><line x1="90" y1="300" x2="660" y2="300" stroke="#536275" stroke-width="2"/><line x1="90" y1="300" x2="90" y2="130" stroke="#536275" stroke-width="2"/><text x="90" y="115" font-size="20" fill="#233345" text-anchor="start">Price</text><text x="375.0" y="342" font-size="20" fill="#536275" text-anchor="middle">House size</text><polyline points="90.0,279.6 164.1,263.2 226.8,249.4 300.9,233.1 375.0,216.7 449.1,200.3 523.2,184.0 585.9,170.2 660.0,153.8" fill="none" stroke="#146b5c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="90" cy="283.0" r="6" fill="#245da8"/><circle cx="164.10000000000002" cy="245.6" r="6" fill="#245da8"/><circle cx="226.79999999999998" cy="262.6" r="6" fill="#245da8"/><circle cx="300.9" cy="215.0" r="6" fill="#245da8"/><circle cx="375.0" cy="228.60000000000002" r="6" fill="#245da8"/><circle cx="449.1" cy="181.0" r="6" fill="#245da8"/><circle cx="523.2" cy="194.6" r="6" fill="#245da8"/><circle cx="585.9" cy="147.0" r="6" fill="#245da8"/><circle cx="660" cy="160.6" r="6" fill="#245da8"/><text x="90" y="370" font-size="22" fill="#233345" text-anchor="start">Small errors on training and new data.</text><text x="30" y="425" font-size="24" fill="#233345" text-anchor="start">Overfit: follows every noisy point</text><line x1="90" y1="587.5" x2="660" y2="587.5" stroke="#dce3eb" stroke-width="2"/><line x1="90" y1="545.0" x2="660" y2="545.0" stroke="#dce3eb" stroke-width="2"/><line x1="90" y1="502.5" x2="660" y2="502.5" stroke="#dce3eb" stroke-width="2"/><line x1="90" y1="460" x2="660" y2="460" stroke="#dce3eb" stroke-width="2"/><line x1="90" y1="630" x2="660" y2="630" stroke="#536275" stroke-width="2"/><line x1="90" y1="630" x2="90" y2="460" stroke="#536275" stroke-width="2"/><text x="90" y="445" font-size="20" fill="#233345" text-anchor="start">Price</text><text x="375.0" y="672" font-size="20" fill="#536275" text-anchor="middle">House size</text><polyline points="90.0,613.0 164.1,575.6 226.8,592.6 300.9,545.0 375.0,558.6 449.1,511.0 523.2,524.6 585.9,477.0 660.0,490.6" fill="none" stroke="#ad3943" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="90" cy="613.0" r="6" fill="#245da8"/><circle cx="164.10000000000002" cy="575.6" r="6" fill="#245da8"/><circle cx="226.79999999999998" cy="592.6" r="6" fill="#245da8"/><circle cx="300.9" cy="545.0" r="6" fill="#245da8"/><circle cx="375.0" cy="558.6" r="6" fill="#245da8"/><circle cx="449.1" cy="511.0" r="6" fill="#245da8"/><circle cx="523.2" cy="524.6" r="6" fill="#245da8"/><circle cx="585.9" cy="477.0" r="6" fill="#245da8"/><circle cx="660" cy="490.6" r="6" fill="#245da8"/><text x="90" y="700" font-size="22" fill="#233345" text-anchor="start">Low training error; new-data error can be high.</text></g></svg>