<svg xmlns="http://www.w3.org/2000/svg" width="760" height="315" viewBox="0 0 760 315" role="img" aria-labelledby="title description"><title id="title">Random splits can leak the future</title><desc id="description">Randomly interleaved training and test days allow future information into a model predicting earlier days.</desc><rect width="760" height="315" rx="12" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="43" font-size="26" fill="#233345" text-anchor="start">Random splits can leak the future</text><text x="30" y="88" font-size="22" fill="#536275" text-anchor="start">Days in chronological order</text><text x="61" y="132" font-size="23" fill="#233345" text-anchor="middle">1</text><rect x="30" y="152" width="62" height="64" rx="7" fill="#dce9f9" stroke="none"/><text x="61" y="192" font-size="18" fill="#245da8" text-anchor="middle">Train</text><text x="131" y="132" font-size="23" fill="#233345" text-anchor="middle">2</text><rect x="100" y="152" width="62" height="64" rx="7" fill="#dce9f9" stroke="none"/><text x="131" y="192" font-size="18" fill="#245da8" text-anchor="middle">Train</text><text x="201" y="132" font-size="23" fill="#233345" text-anchor="middle">3</text><rect x="170" y="152" width="62" height="64" rx="7" fill="#d7eee6" stroke="none"/><text x="201" y="192" font-size="18" fill="#146b5c" text-anchor="middle">Test</text><text x="271" y="132" font-size="23" fill="#233345" text-anchor="middle">4</text><rect x="240" y="152" width="62" height="64" rx="7" fill="#dce9f9" stroke="none"/><text x="271" y="192" font-size="18" fill="#245da8" text-anchor="middle">Train</text><text x="341" y="132" font-size="23" fill="#233345" text-anchor="middle">5</text><rect x="310" y="152" width="62" height="64" rx="7" fill="#dce9f9" stroke="none"/><text x="341" y="192" font-size="18" fill="#245da8" text-anchor="middle">Train</text><text x="411" y="132" font-size="23" fill="#233345" text-anchor="middle">6</text><rect x="380" y="152" width="62" height="64" rx="7" fill="#d7eee6" stroke="none"/><text x="411" y="192" font-size="18" fill="#146b5c" text-anchor="middle">Test</text><text x="481" y="132" font-size="23" fill="#233345" text-anchor="middle">7</text><rect x="450" y="152" width="62" height="64" rx="7" fill="#dce9f9" stroke="none"/><text x="481" y="192" font-size="18" fill="#245da8" text-anchor="middle">Train</text><text x="551" y="132" font-size="23" fill="#233345" text-anchor="middle">8</text><rect x="520" y="152" width="62" height="64" rx="7" fill="#dce9f9" stroke="none"/><text x="551" y="192" font-size="18" fill="#245da8" text-anchor="middle">Train</text><text x="621" y="132" font-size="23" fill="#233345" text-anchor="middle">9</text><rect x="590" y="152" width="62" height="64" rx="7" fill="#d7eee6" stroke="none"/><text x="621" y="192" font-size="18" fill="#146b5c" text-anchor="middle">Test</text><text x="691" y="132" font-size="23" fill="#233345" text-anchor="middle">10</text><rect x="660" y="152" width="62" height="64" rx="7" fill="#dce9f9" stroke="none"/><text x="691" y="192" font-size="18" fill="#245da8" text-anchor="middle">Train</text><text x="30" y="270" font-size="22" fill="#233345" text-anchor="start">Day 6 is tested after training has used days 7, 8, and 10.</text></g></svg>