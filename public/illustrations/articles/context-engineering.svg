<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Context engineering assembles the right information before a model answers</title>
  <desc id="desc">A headphone order and a return policy flow into an application-built request. The assembled request then reaches a model, which answers that the order is eligible for return.</desc>
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#b3ac97" opacity=".3"/>
    </pattern>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L10 7L2 12" fill="none" stroke="context-stroke" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#f5efdf"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect x="24" y="24" width="1152" height="582" rx="22" fill="none" stroke="#bcb7a5" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#293a35">
    <text x="64" y="77" fill="#6b7366" font-size="20" font-weight="700">AI ENGINEERING</text>
    <text x="1136" y="77" fill="#6b7366" font-size="20" font-weight="700" text-anchor="end">06</text>
    <text x="64" y="157" font-size="66" font-weight="700">Context engineering</text>

    <g fill="none" stroke="#287e72" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
      <path d="M334 285H375Q397 285 397 307V333Q397 355 419 355H451"/>
      <path d="M334 455H375Q397 455 397 433V377Q397 355 419 355H451"/>
      <path d="M739 355H794"/>
    </g>

    <rect x="64" y="227" width="270" height="116" rx="18" fill="#fffaf0" stroke="#293a35" stroke-width="3"/>
    <path d="M96 284a30 30 0 0 1 60 0v24M96 284v20c0 10 8 18 18 18h5v-46h-5c-10 0-18 8-18 18m60-10v20c0 10-8 18-18 18h-5v-46h5c10 0 18 8 18 18" fill="none" stroke="#287e72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="176" y="270" fill="#6b7366" font-size="17" font-weight="700">ORDER</text>
    <text x="176" y="308" font-size="23" font-weight="700">Headphones</text>

    <rect x="64" y="397" width="270" height="116" rx="18" fill="#fffaf0" stroke="#293a35" stroke-width="3"/>
    <path d="M98 425h58v62H98zM108 442h38M108 457h38M108 472h26" fill="none" stroke="#287e72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="181" y="440" fill="#6b7366" font-size="17" font-weight="700">RETURN POLICY</text>
    <text x="181" y="480" font-size="29" font-weight="700">30 days</text>

    <rect x="452" y="227" width="287" height="286" rx="22" fill="#d5e8df" stroke="#287e72" stroke-width="4"/>
    <text x="595" y="267" fill="#287e72" font-size="18" font-weight="700" text-anchor="middle">APP ASSEMBLES</text>
    <rect x="482" y="292" width="227" height="58" rx="11" fill="#fffaf0" stroke="#293a35" stroke-width="3"/>
    <text x="595" y="329" font-size="23" font-weight="700" text-anchor="middle">Customer question</text>
    <rect x="482" y="365" width="227" height="58" rx="11" fill="#fffaf0" stroke="#293a35" stroke-width="3"/>
    <text x="595" y="402" font-size="23" font-weight="700" text-anchor="middle">Order facts</text>
    <rect x="482" y="438" width="227" height="48" rx="11" fill="#fffaf0" stroke="#293a35" stroke-width="3"/>
    <text x="595" y="469" font-size="23" font-weight="700" text-anchor="middle">Policy</text>

    <rect x="797" y="267" width="339" height="176" rx="22" fill="#fffaf0" stroke="#293a35" stroke-width="3"/>
    <circle cx="856" cy="355" r="31" fill="#d5e8df" stroke="#287e72" stroke-width="4"/>
    <path d="M843 355l9 9 18-21" fill="none" stroke="#287e72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="910" y="319" fill="#6b7366" font-size="18" font-weight="700">MODEL ANSWERS</text>
    <text x="910" y="358" font-size="23" font-weight="700">Eligible for return</text>
    <text x="910" y="391" fill="#6b7366" font-size="17">based on supplied facts</text>

    <text x="64" y="568" fill="#6b7366" font-size="28">Build the request before asking the model.</text>
  </g>
</svg>
