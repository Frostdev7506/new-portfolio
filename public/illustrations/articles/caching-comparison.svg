<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2070" viewBox="0 0 1080 2070" role="img" aria-labelledby="title desc"><title id="title">Prompt caching and semantic caching reuse different work</title><desc id="desc">Prompt caching reuses eligible shared-prefix processing, then the LLM generates a new answer. Semantic caching finds an eligible similar question and returns its saved answer without a new generation.</desc><defs><pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#b3ac97" opacity="0.36"/></pattern></defs><rect width="1080" height="2070" fill="#f5efdf"/><rect width="1080" height="2070" fill="url(#dots)"/><rect x="28" y="28" width="1024" height="2014" rx="22" fill="none" stroke="#bcb7a5" stroke-width="2"/><text x="72" y="113" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#293a35" text-anchor="start">Prompt caching</text><rect x="72" y="170" width="936" height="216" rx="24" fill="#fffaf0" stroke="#293a35" stroke-width="4"/><rect x="94" y="192" width="892" height="78" rx="14" fill="#d5e8df" stroke="#287e72" stroke-width="4"/><text x="126" y="246" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#287e72" text-anchor="start">Shared instructions</text><text x="126" y="337" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#293a35" text-anchor="start">Explain binary search.</text><path d="M540 386V461 M522 438L540 461L558 438" stroke="#287e72" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="222" y="465" width="636" height="150" rx="24" fill="#d5e8df" stroke="#287e72" stroke-width="4"/><text x="540" y="526" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#287e72" text-anchor="middle">Reuse prefix</text><text x="540" y="583" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#287e72" text-anchor="middle">processing</text><path d="M540 615V640Q540 657 523 657H313Q296 657 296 674V696 M278 673L296 696L314 673" stroke="#287e72" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="164" y="734" width="22" height="18" rx="4" fill="#287e72" stroke="#287e72" stroke-width="4"/><rect x="407" y="734" width="22" height="18" rx="4" fill="#287e72" stroke="#287e72" stroke-width="4"/><rect x="164" y="771" width="22" height="18" rx="4" fill="#287e72" stroke="#287e72" stroke-width="4"/><rect x="407" y="771" width="22" height="18" rx="4" fill="#287e72" stroke="#287e72" stroke-width="4"/><rect x="164" y="808" width="22" height="18" rx="4" fill="#287e72" stroke="#287e72" stroke-width="4"/><rect x="407" y="808" width="22" height="18" rx="4" fill="#287e72" stroke="#287e72" stroke-width="4"/><rect x="182" y="700" width="229" height="156" rx="20" fill="#d5e8df" stroke="#287e72" stroke-width="4"/><text x="296" y="796" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" fill="#293a35" text-anchor="middle">LLM</text><path d="M411 778H657 M635 760L657 778L635 796" stroke="#293a35" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="659" y="682" width="349" height="190" rx="22" fill="#fffaf0" stroke="#293a35" stroke-width="4"/><text x="833.5" y="746" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#293a35" text-anchor="middle">New answer</text><path d="M701 801H966 M701 839H928" stroke="#287e72" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="540" y="947" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#d47846" text-anchor="middle">Generation still runs</text><path d="M72 1013H1008" stroke="#bcb7a5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="1100" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#287e72" text-anchor="start">Semantic caching</text><rect x="72" y="1160" width="936" height="169" rx="24" fill="#fffaf0" stroke="#293a35" stroke-width="4"/><text x="120" y="1264" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" fill="#293a35" text-anchor="start">Explain binary search.</text><path d="M869 1327V1358L924 1327" stroke="#293a35" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M540 1329V1406 M522 1383L540 1406L558 1383" stroke="#287e72" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="182" y="1410" width="716" height="240" rx="24" fill="#d5e8df" stroke="#287e72" stroke-width="4"/><text x="540" y="1484" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#287e72" text-anchor="middle">Eligible similar question</text><rect x="208" y="1526" width="664" height="98" rx="16" fill="#fffaf0" stroke="#287e72" stroke-width="4"/><text x="540" y="1591" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#293a35" text-anchor="middle">What is binary search?</text><path d="M540 1650V1736 M522 1713L540 1736L558 1713" stroke="#287e72" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="202" y="1740" width="676" height="190" rx="22" fill="#fffaf0" stroke="#287e72" stroke-width="4"/><text x="540" y="1816" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" fill="#287e72" text-anchor="middle">Saved answer</text><path d="M254 1871H826 M254 1904H771" stroke="#287e72" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="540" y="2004" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#287e72" text-anchor="middle">No new generation</text></svg>